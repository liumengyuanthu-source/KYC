<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request details — Clear-to-Trade</title><link rel="stylesheet" href="styles.css"><style>body{padding:24px}.request-summary{max-width:800px;margin:auto;background:white;border-radius:22px;padding:32px}h1{margin:24px 0 10px;color:var(--ink);font-size:28px}h2{font-size:18px;margin:28px 0 12px}p,li{font-size:14px;line-height:1.7}ul{padding-left:20px}a{color:var(--body);text-underline-offset:4px}.summary-status{display:inline-block;background:var(--cream);padding:8px 12px;border-radius:8px;margin-top:16px}</style></head><body><main class="request-summary"><a href="index.html">Back to requests</a><h1 id="name"></h1><p id="identity"></p><p class="summary-status" id="status"></p><h2>Current work</h2><p id="work"></p><h2>Next step</h2><p id="next"></p><h2>Expected human review</h2><p id="review"></p><p id="limit" style="margin-top:28px;color:var(--muted)"></p></main><script>
const records={
'DEMO-EDD-002':{name:'Harbourview Industries',identity:'DEMO-EDD-002 · Demo case · New relationship · EDD review',status:'With specialist · No client action requested',work:'Business-sale evidence has been submitted to support the declared source of wealth. Aria is preparing a source-linked comparison for the EDD specialist.',next:'Assess evidence sufficiency and record the EDD judgment, applicable conditions and required approval before the handoff to QA.',review:'The Financial Crime / EDD specialist assesses whether the evidence supports its intended use. Further clarification may be requested. No approval outcome is predicted.',limit:'Illustrative case for this prototype. Receipt of evidence does not mean acceptance or whole-case readiness.'},
'OB-2026-0151':{name:'Kestrel Capital Partners',identity:'OB-2026-0151 · Product extension · SG booking entity · Derivatives (ISDA)',status:'Legal preparation in progress',work:'Legal drafting is the known activity. The primary stage assignment is provisional; other applicable control results have not been provided.',next:'Verify current credit inputs and applicable conditions before legal review or signing.',review:'Relevant credit and legal reviewers record their own judgments and approvals.',limit:'Prototype summary. Other control outcomes and the final decision are unconfirmed.'},
'OB-2026-0093':{name:'Solana Trading Co.',identity:'OB-2026-0093 · Annual refresh · HK booking entity',status:'Legacy record · Cleared 28 Aug 2026',work:'The existing record reports standard due diligence completed in 9 days.',next:'Verify the supporting authorization record and the separate publication outcome.',review:'The supporting decision and authorization records are not included in this prototype summary.',limit:'A legacy cleared label does not supply the missing authorization or publication evidence.'}
};
const record=records[new URLSearchParams(location.search).get('case')];
if(record){for(const [id,text]of Object.entries(record))document.getElementById(id).textContent=text;document.title=record.name+' — Request details';}else{document.getElementById('name').textContent='Request not found';document.getElementById('identity').textContent='Return to requests and choose an available case.';document.querySelectorAll('h2,.summary-status').forEach(el=>el.hidden=true);}
</script></body></html>
